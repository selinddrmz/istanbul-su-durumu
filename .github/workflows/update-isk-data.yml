name: Update official ISKI reservoir data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch reservoir data
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          def get_json(url, headers=None, timeout=15):
              req = urllib.request.Request(url, headers=headers or {"Accept": "application/json", "User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return json.load(response)

          payload = None
          source = None

          # Prefer the official ISKI endpoint.
          official_url = "https://iskiapi.iski.istanbul/api/iski/baraj/sonOnDortGunDoluluk/v2"
          official_headers = {
              "Accept": "application/json",
              "Origin": "https://grafikgoster.iski.gov.tr",
              "Referer": "https://grafikgoster.iski.gov.tr/baraj-doluluk/",
              "User-Agent": "Mozilla/5.0"
          }

          try:
              candidate = get_json(official_url, official_headers, timeout=15)
              if isinstance(candidate.get("data"), list) and candidate["data"]:
                  payload = candidate
                  source = official_url
                  print("Official ISKI endpoint succeeded.")
              else:
                  print("Official ISKI endpoint returned no records.")
          except Exception as exc:
              print(f"Official ISKI endpoint unavailable: {exc}")

          # Public fallback that republishes data from official water authorities,
          # with attribution and measurement timestamp in its response.
          if payload is None:
              fallback_url = "https://www.dolulukorani.com/api/v1/provinces/istanbul/history?days=30"
              candidate = get_json(fallback_url, timeout=20)
              if not isinstance(candidate.get("data"), list) or not candidate["data"]:
                  raise SystemExit("Both official ISKI and fallback sources returned no records.")
              payload = {
                  "source": "dolulukorani.com (official authority data aggregation)",
                  "sourceUrl": fallback_url,
                  "retrievedAt": datetime.now(timezone.utc).isoformat(),
                  "data": candidate["data"],
                  "attribution": candidate.get("attribution", "Source: dolulukorani.com; underlying measurements are published by official water authorities.")
              }
              source = fallback_url
              print("Fallback data source succeeded.")

          payload.setdefault("sourceUrl", source)
          payload.setdefault("retrievedAt", datetime.now(timezone.utc).isoformat())

          out = Path("public/iski-guncel.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"Saved {len(payload['data'])} records from {source}")
          print(f"Retrieved at: {payload.get('retrievedAt')}")
          PY

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add public/iski-guncel.json
          git diff --cached --quiet || git commit -m "Update reservoir data snapshot"
          git push
