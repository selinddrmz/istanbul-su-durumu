      - name: Fetch ISKI daily data
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request
          from pathlib import Path

          url = "https://iskiapi.iski.istanbul/api/iski/baraj/sonOnDortGunDoluluk/v2"
          headers = {
              "Accept": "application/json",
              "Origin": "https://grafikgoster.iski.gov.tr",
              "Referer": "https://grafikgoster.iski.gov.tr/baraj-doluluk/",
              "User-Agent": "Mozilla/5.0"
          }

          payload = None
          for attempt in range(3):
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=60) as response:
                      payload = json.load(response)

                  if not isinstance(payload.get("data"), list) or not payload["data"]:
                      raise ValueError("ISKI API boş veya geçersiz veri döndürdü")
                  break
              except Exception as exc:
                  print(f"Deneme {attempt + 1}/3 başarısız: {exc}")
                  if attempt == 2:
                      raise
                  time.sleep(10)

          out = Path("istanbul-su-web/public/iski-guncel.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          print(f"Kaydedilen kayıt sayısı: {len(payload['data'])}")
          print(f"Son güncelleme: {payload.get('sonGuncellemeZamani')}")
          PY
